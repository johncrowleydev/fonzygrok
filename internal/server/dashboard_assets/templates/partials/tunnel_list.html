{{if .Tunnels}}
<table class="tunnel-table" aria-label="Active tunnels">
    <thead>
        <tr>
            <th>Name</th>
            <th>Public URL</th>
            <th>Local Port</th>
            <th>Connected</th>
        </tr>
    </thead>
    <tbody>
        {{range .Tunnels}}
        <tr>
            <td data-label="Name"><strong>{{.Name}}</strong></td>
            <td data-label="Public URL">
                <span class="copy-wrap tunnel-url-copy">
                    <a href="{{.PublicURL}}" target="_blank" class="mono">{{.PublicURL}}</a>
                    <button class="copy-btn" onclick="navigator.clipboard.writeText('{{.PublicURL}}');this.textContent='✔';this.classList.add('copied');setTimeout(()=>{this.textContent='📋';this.classList.remove('copied')},2000)" title="Copy URL">📋</button>
                </span>
            </td>
            <td data-label="Local Port">{{.LocalPort}}</td>
            <td data-label="Connected">{{.ConnectedAt}}</td>
        </tr>
        {{end}}
    </tbody>
</table>
{{else}}
<div class="empty">
    No active tunnels.
    <code>fonzygrok --server your-server.com --token fgk_... --port 3000</code>
</div>
{{end}}
